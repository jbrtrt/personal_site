name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/professional-portfolio-site-6x2q4u
  workflow_dispatch:

# Allow one concurrent deployment; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The offline gates: ECG intervals against their reference ranges, and
      # WCAG contrast on both grounds. Both exit non-zero on failure, so a
      # regression in either fails the deploy instead of shipping a rhythm
      # strip a clinician would flag or type nobody can read.
      - run: npm run verify

      # Typecheck runs as part of build; a type error fails the deploy
      # rather than shipping a broken bundle.
      - run: npm run build

      # enablement:true forces build_type: workflow via the Pages API.
      # Without it this step accepts whatever the repo already has — and if
      # that is "Deploy from a branch", GitHub's legacy pages builder also
      # runs on every push, publishing the raw repo root (whose index.html
      # points at /src/main.ts) over the top of this job's dist/. Asserting
      # the mode here means the deploy cannot silently regress.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
